<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;1,400;1,900&display=swap" rel="stylesheet">
    <!-- React & Framer Motion CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #000; color: #fff; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .selection-amber::selection { background: #f59e0b; color: #000; }
    </style>
</head>
<body class="selection-amber">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        const WHATSAPP_LINK = "https://wa.me/5583981280390?text=Olá,%20vim%20pelo%20site%20e%20quero%20agendar%20minha%20tattoo";
        const INSTAGRAM_LINK = "https://www.instagram.com/conexaoartetatoo/";

        // Icons Helper
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide) {
                    const iconSvg = window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const JOURNEY_STEPS = [
            { number: "01", title: "Consulta Estratégica", desc: "Análise profunda da sua ideia, anatomia e o significado por trás da arte.", icon: "search" },
            { number: "02", title: "Design Exclusivo", desc: "Projeto digital único refinado por um mestre, garantindo exclusividade total.", icon: "pen-tool" },
            { number: "03", title: "Execução Premium", desc: "Procedimento biosseguro com tecnologia de ponta para máximo conforto.", icon: "droplet" },
            { number: "04", title: "Pós-Acompanhado", desc: "Protocolo de cicatrização assistida para garantir a longevidade da arte.", icon: "shield-check" }
        ];

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [activeStep, setActiveStep] = useState(0);

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, isMenuOpen, activeStep]);

            return (
                <div className="min-h-screen flex flex-col relative overflow-x-hidden">
                    {/* Floating Nav */}

                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-8 h-8 border border-brand-amber flex items-center justify-center rotate-45">
                                    <span className="-rotate-45 font-black text-brand-amber">R</span>
                                </div>
                                <span className="font-black text-[9px] tracking-widest hidden sm:block">CONEXÃO ARTE TATTOO</span>
                            </div>
                            
                            <div className="hidden lg:flex items-center gap-8 text-[9px] uppercase font-bold tracking-widest">
                                {['home', 'método', 'portfólio', 'sobre'].map(tab => (
                                    <button 
                                        key={tab} 
                                        onClick={() => setActiveTab(tab === 'método' ? 'metodo' : tab)}
                                        className={activeTab === (tab === 'método' ? 'metodo' : tab) ? 'text-brand-amber' : 'text-gray-400'}
                                    >
                                        {tab}
                                    </button>
                                ))}
                                <a href={WHATSAPP_LINK} className="bg-brand-amber text-black px-4 py-2 font-black">ORÇAMENTO</a>
                            </div>

                            <button className="lg:hidden text-white" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                    </nav>

                    <main className="flex-grow pt-24">
                        <AnimatePresence mode="wait">
                            {activeTab === 'home' && (
                                <motion.div key="h" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                    <section className="container mx-auto px-6 py-12 lg:py-24 grid lg:grid-cols-2 gap-12 items-center">
                                        <div>
                                            <div className="inline-flex items-center gap-2 px-3 py-1 bg-brand-amber/10 border border-brand-amber/20 rounded-full mb-6">
                                                <span className="text-[8px] font-black tracking-widest text-brand-amber uppercase">+2.500 CLIENTES ATENDIDOS</span>
                                            </div>
                                            <h1 className="text-6xl lg:text-8xl font-serif italic mb-8 leading-tight">
                                                Sua pele é uma <br/>
                                                <span className="text-brand-amber not-italic font-sans font-black">OBRA PRIMA</span>.
                                            </h1>
                                            <p className="text-gray-400 text-lg mb-10 border-l border-brand-amber pl-6 italic">
                                                Especialista em Realismo e Fine Line em Lagoa de Dentro. Atendimento de luxo para quem não aceita erros.
                                            </p>
                                            <div className="flex flex-col sm:flex-row gap-6">
                                                <a href={WHATSAPP_LINK} className="bg-brand-amber text-black px-10 py-5 font-black uppercase text-xs tracking-widest text-center">Quero minha tattoo exclusiva</a>
                                                <button onClick={() => setActiveTab('portfolio')} className="text-gray-500 uppercase font-black text-[10px] tracking-widest">Ver Trabalhos</button>

                                        </div>
                                        <div className="relative flex justify-center">

                                            <img src="https://images.unsplash.com/photo-1590201103759-58b9015bc299?q=80&w=600" className="w-full max-w-md relative z-10 grayscale hover:grayscale-0 transition-all duration-1000 rounded-sm shadow-2xl" />
                                        </div>
                                    </section>

                                    <section className="bg-zinc-950 py-24 border-y border-white/5">
                                        <div className="container mx-auto px-6 text-center max-w-3xl">
                                            <h2 className="text-4xl font-serif italic mb-8">"Sua pele não é lugar para erro."</h2>
                                            <p className="text-gray-500 mb-12 italic">Trabalhos baratos costumam render arrependimentos caros. Escolha um mestre que garante biossegurança, anatomia e perfeição técnica.</p>
                                            <a href={WHATSAPP_LINK} className="border border-brand-amber text-brand-amber px-8 py-4 font-black uppercase text-[10px] tracking-widest hover:bg-brand-amber hover:text-black transition-all">Garantir Qualidade Premium</a>
                                        </div>
                                    </section>
                                </motion.div>
                            )}

                            {activeTab === 'metodo' && (
                                <motion.div key="m" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="container mx-auto px-6 py-12">
                                    <div className="mb-12">
                                        <span className="text-brand-amber font-black text-[8px] tracking-[0.4em] uppercase">Estratégia & Arte</span>
                                        <h2 className="text-4xl font-serif italic">MÉTODO <span className="text-brand-amber font-sans font-black">CONEXÃO™</span></h2>
                                    </div>
                                    <div className="grid lg:grid-cols-12 gap-12">
                                        <div className="lg:col-span-4 flex flex-col gap-4">
                                            {JOURNEY_STEPS.map((s, idx) => (
                                                <button key={idx} onClick={() => setActiveStep(idx)} className={`p-6 text-left border flex items-center gap-6 transition-all ${activeStep === idx ? 'bg-brand-amber text-black border-brand-amber' : 'border-white/5 text-white'}`}>
                                                    <span className="text-2xl font-black italic opacity-30">{s.number}</span>
                                                    <span className="font-serif italic text-lg">{s.title}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="lg:col-span-8 bg-zinc-900/50 p-12 border border-white/5">
                                            <h3 className="text-5xl font-serif italic mb-8">{JOURNEY_STEPS[activeStep].title}</h3>
                                            <p className="text-2xl text-gray-400 font-light leading-relaxed mb-10">{JOURNEY_STEPS[activeStep].desc}</p>
                                            <a href={WHATSAPP_LINK} className="text-brand-amber font-black uppercase text-[10px] tracking-widest border-b border-brand-amber/30 pb-2">Iniciar Agendamento</a>
                                        </div>
                                    </div>
                                </motion.div>
                            )}

                            {activeTab === 'portfólio' && (
                               <motion.div key="p" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="container mx-auto px-6 py-12">
                                    <h2 className="text-4xl font-serif italic mb-12">Portfólio <span className="text-brand-amber font-sans font-black">PREMIUM</span></h2>
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
                                        {[1,2,3,4,5,6,7,8].map(i => (
                                            <div key={i} className="aspect-[3/4] bg-zinc-900 group overflow-hidden relative">
                                                <img src={`https://picsum.photos/seed/${i+40}/600/800`} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent opacity-0 group-hover:opacity-100 transition-all p-6 flex flex-col justify-end">
                                                    <span className="text-[8px] text-brand-amber font-black tracking-widest uppercase">Trabalho Real</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                               </motion.div>
                            )}
                            
                            {activeTab === 'sobre' && (
                                <motion.div key="s" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="container mx-auto px-6 py-12">
                                    <div className="grid lg:grid-cols-2 gap-16 items-center">
                                        <div>
                                            <h2 className="text-6xl font-black mb-8">Renato <span className="text-brand-amber">Andrade</span></h2>
                                            <p className="text-2xl font-serif italic text-gray-400 mb-8 leading-relaxed">"Conectando sua essência à melhor versão da arte."</p>
                                            <p className="text-gray-500 leading-relaxed mb-10">Referência em realismo na Paraíba, Renato Andrade foca em exclusividade técnica e biossegurança extrema.</p>
                                            <div className="space-y-4">
                                                <div className="p-6 bg-zinc-900 border border-white/5 italic text-gray-300">
                                                    "O realismo do Renato é de outro mundo. Valeu cada centavo pela segurança."
                                                    <div className="text-[10px] uppercase font-black text-brand-amber mt-4">— Lucas Mendes</div>
                                                </div>
                                            </div>
                                        </div>
                                        <img src="https://images.unsplash.com/photo-1542332606-b3d270fd066c?q=80&w=800" className="w-full grayscale border border-white/10" />
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>

                    <footer className="bg-black py-24 border-t border-white/5 mt-auto text-center">
                        <div className="container mx-auto px-6">
                            <h2 className="text-5xl lg:text-7xl font-serif italic mb-12 leading-tight">Pronto para marcar sua <span className="text-brand-amber font-sans font-black">HISTÓRIA</span>?</h2>
                            <a href={WHATSAPP_LINK} className="bg-brand-amber text-black px-12 py-6 font-black uppercase text-sm tracking-[0.4em] shadow-2xl">Iniciar conexão agora</a>
                            <div className="mt-20 flex flex-col md:flex-row justify-between items-center gap-10 opacity-50">
                                <span className="text-[9px] font-black tracking-widest uppercase">© 2026 RENATO ANDRADE - CONEXÃO ARTE</span>
                                <div className="flex gap-8">
                                    <a href={INSTAGRAM_LINK} target="_blank"><Icon name="instagram" size={18} /></a>
                                    <a href={WHATSAPP_LINK} target="_blank"><Icon name="message-circle" size={18} /></a>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
