<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexão Arte Tattoo | Renato Andrade</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <!-- Scripts Necessários -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .text-brand-amber { color: #f59e0b; }
        .bg-brand-amber { background-color: #f59e0b; }
        .border-brand-amber { border-color: #f59e0b; }
        .selection\:bg-brand-amber::selection { background-color: #f59e0b; color: #000; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; }
    </style>
</head>
<body class="selection:bg-brand-amber selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Configurações ---
        const WHATSAPP_LINK = "https://wa.me/5583981280390?text=Olá,%20vim%20pelo%20site%20e%20quero%20agendar%20minha%20tattoo";
        const INSTAGRAM_LINK = "https://www.instagram.com/conexaoartetatoo/";

        const JOURNEY_STEPS = [
            { number: "01", title: "Consulta Estratégica", desc: "Análise profunda da sua ideia e anatomia para uma arte que faça sentido no seu corpo.", icon: "search" },
            { number: "02", title: "Design Exclusivo", desc: "Criação de um projeto único, refinado por um mestre, focado em exclusividade total.", icon: "pen-tool" },
            { number: "03", title: "Execução Premium", desc: "Aplicação com técnicas avançadas de realismo e biossegurança de nível hospitalar.", icon: "droplet" },
            { number: "04", title: "Pós-Assistido", desc: "Acompanhamento direto pós-tattoo para garantir que a cicatrização seja perfeita.", icon: "shield-check" }
        ];

        const GALLERY = [
            "https://images.unsplash.com/photo-1590201103759-58b9015bc299?q=80&w=800",
            "https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?q=80&w=800",
            "https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?q=80&w=800",
            "https://images.unsplash.com/photo-1504198453319-5ce911baf2ef?q=80&w=800"
        ];

        // Componente de Ícone Dinâmico (Lucide)
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);
            const [activeStep, setActiveStep] = useState(0);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen flex flex-col relative overflow-x-hidden">
                    {/* Background Decor */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        <div className="absolute top-0 right-0 w-[40%] h-[40%] bg-amber-500/5 rounded-full blur-[120px]" />
                        <div className="absolute bottom-0 left-0 w-[40%] h-[40%] bg-white/5 rounded-full blur-[120px]" />
                    </div>

                    {/* Navbar */}
                    <nav className={`fixed top-0 left-0 w-full z-50 transition-all duration-500 ${isScrolled || activeTab !== 'home' ? 'bg-black/95 backdrop-blur-xl py-3 border-b border-white/5' : 'bg-transparent py-5'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <button onClick={() => setActiveTab('home')} className="flex items-center gap-3">
                                <div className="w-8 h-8 border border-brand-amber/40 flex items-center justify-center rotate-45">
                                    <span className="-rotate-45 font-black text-brand-amber text-lg">R</span>
                                </div>
                                <span className="uppercase tracking-[0.2em] font-black text-[9px] text-white hidden sm:block">CONEXÃO ARTE TATTOO</span>
                            </button>

                            <div className="hidden lg:flex items-center gap-8">
                                {['Início', 'Método', 'Portfólio', 'Sobre'].map((name, i) => {
                                    const id = ['home', 'metodo', 'portfolio', 'sobre'][i];
                                    return (
                                        <button 
                                            key={id} 
                                            onClick={() => setActiveTab(id)} 
                                            className={`text-[8px] uppercase tracking-[0.3em] font-medium transition-all ${activeTab === id ? 'text-brand-amber border-b border-brand-amber' : 'text-gray-400 hover:text-brand-amber'}`}
                                        >
                                            {name}
                                        </button>
                                    );
                                })}
                                <a href={WHATSAPP_LINK} target="_blank" className="px-5 py-2 bg-brand-amber text-black text-[9px] uppercase font-black tracking-[0.2em]">Agendar</a>
                            </div>

                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="lg:hidden text-white">
                                <Icon name={isMenuOpen ? "x" : "menu"} />
                            </button>
                        </div>
                    </nav>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {isMenuOpen && (
                            <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }} className="fixed inset-0 z-40 bg-black pt-24 px-8 flex flex-col gap-8 lg:hidden">
                                {['Início', 'Método', 'Portfólio', 'Sobre'].map((name, i) => (
                                    <button key={i} onClick={() => { setActiveTab(['home', 'metodo', 'portfolio', 'sobre'][i]); setIsMenuOpen(false); }} className="text-2xl font-black italic text-white uppercase text-left">{name}</button>
                                ))}
                                <a href={WHATSAPP_LINK} target="_blank" className="mt-4 bg-brand-amber text-black py-5 text-center font-black uppercase tracking-widest text-xs">Iniciar Conexão</a>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Conteúdo Principal */}
                    <main className="flex-grow pt-20 relative z-10">
                        <AnimatePresence mode="wait">
                            {activeTab === 'home' && (
                                <motion.section key="home" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="container mx-auto px-6 py-12 md:py-24">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                        <div>
                                            <div className="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/20 rounded-full mb-6">
                                                <Icon name="star" size={10} className="text-brand-amber" />
                                                <span className="text-[7px] uppercase font-bold tracking-widest text-brand-amber">Agenda 2026 Aberta | Vagas Limitadas</span>
                                            </div>
                                            <h1 className="text-5xl md:text-8xl font-serif italic mb-8 leading-[0.9]">Sua pele é uma <br/><span className="not-italic font-black text-brand-amber">OBRA PRIMA.</span></h1>
                                            <p className="text-gray-400 text-sm md:text-lg mb-10 max-w-md italic border-l border-brand-amber/40 pl-5">Especialista em Realismo e Fine Line de Luxo. Garantimos que sua história seja eternizada com precisão absoluta.</p>
                                            <div className="flex flex-col sm:flex-row gap-6">
                                                <a href={WHATSAPP_LINK} target="_blank" className="bg-brand-amber text-black px-8 py-5 font-black uppercase text-[10px] tracking-widest text-center shadow-lg hover:scale-105 transition-transform">Quero minha tattoo exclusiva</a>
                                                <button onClick={() => setActiveTab('portfolio')} className="text-[9px] uppercase font-black text-white/40 hover:text-brand-amber transition-colors px-4 py-5">Ver Portfólio</button>
                                            </div>
                                        </div>
                                        <div className="relative flex justify-center">
                                            <div className="absolute inset-0 bg-brand-amber/5 blur-[80px] rounded-full animate-pulse"></div>
                                            <img src="https://images.unsplash.com/photo-1590201103759-58b9015bc299?q=80&w=800" className="w-full max-w-sm relative z-10 grayscale hover:grayscale-0 transition-all duration-1000 brightness-75 rounded-sm shadow-2xl" />
                                        </div>
                                    </div>

                                    {/* Risk Block */}
                                    <div className="mt-32 py-16 px-8 border border-white/5 bg-zinc-950/50 text-center rounded-sm">
                                        <h2 className="text-2xl md:text-4xl font-serif italic mb-6">"Sua pele não é lugar para erro."</h2>
                                        <p className="text-gray-500 text-sm md:text-base max-w-2xl mx-auto mb-10 leading-relaxed font-light">Não corra riscos com quem não domina a técnica. No nosso atelier, cada traço é planejado anatomicamente para durar a vida toda sem falhas.</p>
                                        <div className="flex flex-wrap justify-center gap-8">
                                            {["Biossegurança Gringa", "Equipamento Premium", "Arte Exclusiva", "Pós-Agendado"].map((t, i) => (
                                                <div key={i} className="flex items-center gap-2 text-[8px] font-black uppercase tracking-widest text-white/60">
                                                    <Icon name="check" size={12} className="text-brand-amber" /> {t}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </motion.section>
                            )}

                            {activeTab === 'metodo' && (
                                <motion.section key="metodo" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0 }} className="container mx-auto px-6 py-12 md:py-24">
                                    <div className="mb-12 border-l-4 border-brand-amber pl-6">
                                        <span className="text-[8px] uppercase tracking-widest text-brand-amber font-black">Nosso Diferencial</span>
                                        <h2 className="text-4xl md:text-6xl font-serif italic">Método <span className="not-italic font-black text-brand-amber">CONEXÃO™</span></h2>
                                    </div>
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                        <div className="lg:col-span-4 flex flex-col gap-2">
                                            {JOURNEY_STEPS.map((s, i) => (
                                                <button key={i} onClick={() => setActiveStep(i)} className={`p-6 text-left flex items-center gap-4 border transition-all ${activeStep === i ? 'bg-brand-amber border-brand-amber text-black' : 'bg-black border-white/5 text-white'}`}>
                                                    <span className="text-2xl font-black italic opacity-30">{s.number}</span>
                                                    <span className="font-serif italic text-lg">{s.title}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="lg:col-span-8 p-10 md:p-20 bg-zinc-900 border border-white/5 relative overflow-hidden h-[400px] flex flex-col justify-center">
                                            <div className="absolute top-10 right-10 opacity-5 -z-0">
                                                 <Icon name={JOURNEY_STEPS[activeStep].icon} size={150} />
                                            </div>
                                            <h3 className="text-3xl md:text-5xl font-serif italic mb-6 relative z-10">{JOURNEY_STEPS[activeStep].title}</h3>
                                            <p className="text-gray-400 text-lg md:text-2xl font-light leading-relaxed max-w-xl relative z-10">{JOURNEY_STEPS[activeStep].desc}</p>
                                        </div>
                                    </div>
                                </motion.section>
                            )}

                            {activeTab === 'portfolio' && (
                                <motion.section key="portfolio" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="container mx-auto px-6 py-12 md:py-24">
                                    <div className="text-center mb-16">
                                        <h2 className="text-4xl md:text-7xl font-serif italic">OBRAS <span className="not-italic font-black text-brand-amber">MESTRAS</span></h2>
                                        <p className="text-gray-500 text-xs mt-4 tracking-widest uppercase">Trabalhos reais de clientes satisfeitos</p>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-1">
                                        {GALLERY.map((u, i) => (
                                            <div key={i} className="aspect-[3/4] overflow-hidden bg-zinc-900 relative group">
                                                <img src={u} className="w-full h-full object-cover grayscale brightness-50 group-hover:grayscale-0 group-hover:scale-110 transition-all duration-700" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-6 flex flex-col justify-end">
                                                    <p className="text-white font-serif italic text-xl">Artes Autorais</p>
                                                    <p className="text-brand-amber text-[8px] font-black uppercase tracking-widest">Premium Level</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </motion.section>
                            )}

                            {activeTab === 'sobre' && (
                                <motion.section key="sobre" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="container mx-auto px-6 py-12 md:py-24">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                                        <div>
                                            <h2 className="text-5xl md:text-8xl font-black leading-[0.85] mb-8">RENATO <span className="text-brand-amber">ANDRADE</span></h2>
                                            <p className="text-xl italic text-gray-400 border-l-4 border-brand-amber pl-8 mb-10 leading-relaxed font-light">"Minha missão é garantir que sua pele tenha a melhor versão da arte que você escolheu."</p>
                                            <p className="text-gray-500 leading-relaxed mb-10 font-light">Com 8 anos de experiência no mercado de luxo, Renato é hoje a referência número 1 em Lagoa de Dentro/PB. Focado em higiene máxima e precisão anatômica.</p>
                                            <div className="space-y-4 mb-10">
                                                {[
                                                    { name: "Lucas M.", text: "Realismo de outro mundo, sensacional." },
                                                    { name: "Carla S.", text: "O melhor atendimento que já tive em estúdios." }
                                                ].map((t, i) => (
                                                    <div key={i} className="p-6 bg-white/5 border border-white/5 backdrop-blur-sm">
                                                        <div className="flex gap-1 text-brand-amber mb-2"><Icon name="star" size={12} className="fill-current" /> <Icon name="star" size={12} className="fill-current" /> <Icon name="star" size={12} className="fill-current" /> <Icon name="star" size={12} className="fill-current" /> <Icon name="star" size={12} className="fill-current" /></div>
                                                        <p className="text-sm italic text-gray-300">"{t.text}"</p>
                                                        <p className="text-right text-[8px] font-black uppercase text-brand-amber/50 mt-2">— {t.name}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            <a href={WHATSAPP_LINK} target="_blank" className="bg-brand-amber text-black px-10 py-5 font-black uppercase text-[10px] tracking-widest inline-block transform hover:scale-105 active:scale-95 transition-all">Falar com Renato</a>
                                        </div>
                                        <div className="relative">
                                            <div className="aspect-[4/5] bg-zinc-900 border-8 border-white/5 overflow-hidden ring-1 ring-white/10">
                                                <img src="https://images.unsplash.com/photo-1542332606-b3d270fd066c?q=80&w=1000" className="w-full h-full object-cover grayscale brightness-75 hover:grayscale-0 transition-all duration-1000" />
                                            </div>
                                            <div className="absolute -bottom-6 -left-6 bg-brand-amber text-black p-8 hidden md:block">
                                                <p className="text-5xl font-black italic">8 ANOS</p>
                                                <p className="text-[9px] uppercase tracking-widest font-black opacity-60">Experiência Master</p>
                                            </div>
                                        </div>
                                    </div>
                                </motion.section>
                            )}
                        </AnimatePresence>
                    </main>

                    {/* Footer CTA */}
                    <section className="py-24 border-t border-white/5 bg-zinc-950 text-center">
                        <h2 className="text-4xl md:text-7xl font-serif italic mb-10 leading-tight px-6 max-w-4xl mx-auto">Pronto para marcar sua história na pele com <span className="not-italic font-black text-brand-amber underline decoration-white/10 underline-offset-8">EXCELÊNCIA</span>?</h2>
                        <a href={WHATSAPP_LINK} target="_blank" className="bg-brand-amber text-black px-12 md:px-24 py-8 font-black uppercase text-xs tracking-[0.4em] shadow-2xl hover:scale-105 transition-transform inline-block">Iniciar meu agendamento</a>
                        <div className="mt-12 flex flex-col items-center gap-4 text-white/50 text-[8px] font-black uppercase tracking-[0.3em]">
                            <Icon name="message-square" className="text-brand-amber" />
                            <span>Agenda 2026 com vagas limitadas</span>
                        </div>
                    </section>

                    <footer className="py-10 bg-black border-t border-white/5 px-6">
                        <div className="container mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <span className="text-[10px] uppercase font-black tracking-widest text-white/40">© 2026 CONEXÃO ARTE TATTOO</span>
                            <div className="flex gap-10">
                                <a href={INSTAGRAM_LINK} target="_blank" className="text-gray-600 hover:text-brand-amber"><Icon name="instagram" size={18} /></a>
                                <a href={WHATSAPP_LINK} target="_blank" className="text-gray-600 hover:text-brand-amber"><Icon name="message-circle" size={18} /></a>
                            </div>
                            <span className="text-[8px] uppercase tracking-widest font-black text-gray-800">Designed for High Performance</span>
                        </div>
                    </footer>

                    {/* Float Button */}
                    <a href={WHATSAPP_LINK} target="_blank" className="fixed bottom-8 right-8 z-50 w-16 h-16 bg-brand-amber text-black flex items-center justify-center rounded-full shadow-2xl animate-bounce hover:animate-none group transform hover:scale-110 active:scale-95 transition-all">
                        <Icon name="message-circle" size={28} />
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
